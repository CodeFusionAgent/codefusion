# CodeFusion Configuration

# LLM Settings
llm:
  model: "gpt-4o"
  api_key: ""
  max_tokens: 2000
  #temperature: 0.7

# Agent Settings
agents:
  max_iterations: 10
  timeout: 300  # seconds
  use_pipeline_architecture: true  # Use new modular pipeline architecture (recommended)
  max_files_to_analyze: 50  # Maximum files for discovery pipeline

  # Synthesis configuration
  synthesis:
    target_narrative_min: 3000  # Minimum narrative word count
    target_narrative_max: 5000  # Maximum narrative word count
    max_key_files_cited: 7      # Maximum files to cite
    min_key_files_cited: 3      # Minimum files to cite

  # Thresholds for confidence scoring
  thresholds:
    high_confidence: 0.8
    medium_confidence: 0.7
    low_confidence: 0.6
    error_confidence: 0.2
    partial_confidence: 0.5
    max_confidence: 0.9

# Cache Settings
cache:
  enabled: false                 # Set to false to disable caching for debugging
  cache_dir: "cf_cache"          # Directory to store cache files
  ttl: 3600                      # Time to live in seconds (1 hour)
  similarity_threshold: 0.8      # Semantic similarity threshold (0.0-1.0)

# Tracing Settings
trace:
  enabled: true
  output_dir: "cf_trace"

# Logging Settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  verbose: false  # Enable detailed agent activity logging
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Repository Settings
repo:
  max_files: 1000
  max_file_size: 1048576  # 1MB
  max_scan_depth: 5  # Maximum directory depth for repository scanning
  max_analysis_files: 50  # Maximum files to analyze for performance control
  # Source code extensions (analyzed by CodeAgent)
  source_code_extensions:
    - ".py"
    - ".js" 
    - ".ts"
    - ".jsx"
    - ".tsx"
    - ".java"
    - ".cpp"
    - ".c"
    - ".h"
    - ".hpp"
    - ".go"
    - ".rs"
    - ".rb"
    - ".php"
    - ".swift"
    - ".kt"
    - ".scala"
    - ".cs"
    - ".vb"
    - ".r"
    - ".m"
    - ".mm"
    - ".cc"
    - ".cxx"
    - ".hh"
    - ".hxx"
    - ".f90"
    - ".f95"
    - ".pl"
    - ".pm"
    - ".sh"
    - ".bash"
    - ".zsh"
    - ".fish"
  
  # Configuration/schema files (analyzed by CodeAgent)
  config_extensions:
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
    - ".ini"
    - ".cfg"
    - ".conf"
    - ".xml"
    - ".html"
    - ".css"
    - ".sql"
  
  # Documentation extensions (handled by DocsAgent)
  documentation_extensions:
    - ".md"
    - ".rst"
    - ".txt"
    - ".adoc"
    - ".org"
  
  # All text extensions (for general file operations)
  text_extensions:
    - ".py"
    - ".js" 
    - ".ts"
    - ".jsx"
    - ".tsx"
    - ".java"
    - ".cpp"
    - ".c"
    - ".h"
    - ".hpp"
    - ".go"
    - ".rs"
    - ".rb"
    - ".php"
    - ".swift"
    - ".kt"
    - ".scala"
    - ".cs"
    - ".vb"
    - ".r"
    - ".m"
    - ".mm"
    - ".cc"
    - ".cxx"
    - ".hh"
    - ".hxx"
    - ".f90"
    - ".f95"
    - ".pl"
    - ".pm"
    - ".sh"
    - ".bash"
    - ".zsh"
    - ".fish"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
    - ".ini"
    - ".cfg"
    - ".conf"
    - ".xml"
    - ".html"
    - ".css"
    - ".sql"
    - ".md"
    - ".rst"
    - ".txt"
    - ".adoc"
    - ".org"
  excluded_dirs:
    - ".git"
    - "__pycache__"
    - "node_modules"
    - ".venv"
    - "venv"
    - "build"
    - "dist"
    - "test"
    - "tests"
    - "spec"
  excluded_extensions:
    - ".pyc"
    - ".pyo"
    - ".so"
    - ".dll"

# Knowledge Base Settings (Structural Analysis)
knowledge_base:
  enabled: true  # Enable persistent knowledge base (recommended for large repos)
  type: neo4j

  # Neo4j Connection Settings
  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: ""  # Set via NEO4J_PASSWORD environment variable
    database: "codefusion"

  # KB Build Settings
  build:
    # Parallel processing for KB construction
    parallel_workers: 10  # Number of parallel workers for parsing
    batch_size: 100       # Files per batch
    progress_interval: 1000  # Log progress every N files

    # Languages to parse (currently only Python supported)
    languages:
      - python
      # Future: javascript, typescript, go, java

    # Build on first analysis
    auto_build: true  # Automatically build KB if doesn't exist

  # Incremental Update Settings
  incremental:
    enabled: true  # Enable incremental updates (dramatically improves performance)
    check_interval: 300  # Check for file changes every N seconds
    auto_update: true  # Automatically update KB when files change
    use_file_hashing: true  # Use MD5 hashing for accurate change detection

  # Query Optimization
  query:
    max_graph_depth: 5  # Maximum depth for call chain traversal
    cache_query_results: true  # Cache graph query results
    cache_ttl: 3600  # Query cache TTL in seconds
    max_results: 100  # Maximum results per query

  # Discovery Enhancement
  discovery:
    use_kb_queries: true  # Use graph queries for file discovery (much faster)
    fallback_to_keywords: true  # Fall back to keyword matching if KB query fails
    prefer_structural_queries: true  # Prefer structural queries over keyword matching
