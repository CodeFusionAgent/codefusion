# Knowledge Base Settings (Structural Analysis)
knowledge_base:
  enabled: true  # Enable persistent knowledge base (recommended for large repos)
  type: sqlite  # Options: "neo4j" (graph DB, best for large codebases) or "sqlite" (file-based, lightweight)

  # Neo4j Connection Settings (when type = "neo4j")
  # Recommended for: Large codebases (>10K files), complex graph queries, production use
  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: ""  # Set via NEO4J_PASSWORD environment variable
    database: "codefusion"

  # SQLite Settings (when type = "sqlite")
  # Recommended for: Small-medium codebases (<10K files), local development, quick setup
  # No external database server required - stores everything in a single file
  sqlite:
    db_path: ".codefusion/knowledge.db"  # Path to SQLite database file

  # KB Build Settings
  build:
    # Parallel processing for KB construction
    parallel_workers: 10  # Number of parallel workers for parsing
    batch_size: 100       # Files per batch
    progress_interval: 1000  # Log progress every N files
    max_build_time_seconds: 7200  # Maximum time for KB build (2 hours)

    # Languages to parse (currently only Python supported)
    languages:
      - python
      # Future: javascript, typescript, go, java

    # Build on first analysis
    auto_build: true  # Automatically build KB if doesn't exist

  # Incremental Update Settings
  incremental:
    enabled: true  # Enable incremental updates (dramatically improves performance)
    check_interval: 300  # Check for file changes every N seconds
    auto_update: true  # Automatically update KB when files change
    use_file_hashing: true  # Use MD5 hashing for accurate change detection

  # Query Optimization
  query:
    max_graph_depth: 5  # Maximum depth for call chain traversal
    cache_query_results: true  # Cache graph query results
    cache_ttl: 3600  # Query cache TTL in seconds
    max_results: 100  # Maximum results per query

  # Discovery Enhancement
  discovery:
    use_kb_queries: true  # Use graph queries for file discovery (much faster)
    fallback_to_keywords: true  # Fall back to keyword matching if KB query fails
    prefer_structural_queries: true  # Prefer structural queries over keyword matching

  # Semantic Layer Settings
  semantic:
    enabled: true  # Enable semantic search and code similarity
    # Use local sentence-transformers (no external API calls)
    embedding_model: "all-MiniLM-L6-v2"  # or "all-mpnet-base-v2" for higher quality
    use_local_model: true  # Prefer local embeddings
    use_llm_client: false  # Do not route embeddings through LLMClient
    cache_embeddings: true  # Cache embeddings to disk
    cache_file: ".codefusion/embeddings.pkl"
    similarity_threshold: 0.3  # Minimum similarity for search results (lowered from 0.5 to capture domain-specific queries)
    default_relevance: 0.7  # Default relevance score if invalid

    # Semantic Search API Defaults
    default_top_k: 10  # Default number of results to return
    default_min_similarity: 0.5  # Default minimum similarity threshold
    function_search_min_similarity: 0.7  # Minimum similarity for function searches
    class_search_min_similarity: 0.7  # Minimum similarity for class searches
    duplicate_code_threshold: 0.8  # Similarity threshold for duplicate code detection

  # Pattern Recognition Settings
  patterns:
    enabled: true  # Enable design pattern and code smell detection
    detect_design_patterns: true  # Detect design patterns (Factory, Singleton, etc)
    detect_architectural_patterns: true  # Detect architectural patterns (MVC, Repository, etc)
    detect_code_smells: true  # Detect code smells (God Class, Long Method, etc)
    max_classes_to_analyze: 500  # Maximum classes to query for pattern detection

    # Pattern detection confidence scoring
    confidence:
      min_confidence: 0.5  # Minimum confidence to report pattern
      max_confidence: 0.95  # Maximum confidence cap
      # Singleton pattern scoring
      singleton_private_constructor: 0.3
      singleton_static_instance: 0.3
      singleton_lazy_init: 0.2
      # Factory pattern scoring
      factory_return_type: 0.5
      factory_conditional: 0.3
      factory_polymorphism: 0.2
      # Observer pattern scoring
      observer_subject_methods: 0.6
      observer_update_method: 0.2
      observer_subscription: 0.2
      # Strategy pattern scoring
      strategy_interface: 0.5
      strategy_context: 0.3
      strategy_runtime_switching: 0.2
      # Decorator pattern scoring
      decorator_wrapping: 0.5
      decorator_same_interface: 0.3
      decorator_enhancement: 0.2
      # MVC pattern scoring
      mvc_controller: 0.4
      mvc_model: 0.3
      mvc_view: 0.3
      # Repository pattern scoring
      repository_data_access: 0.5
      repository_crud: 0.3
      repository_abstraction: 0.2
      # Service layer scoring
      service_business_logic: 0.5
      service_orchestration: 0.3
      service_transactions: 0.2

      # Architectural pattern scoring (high-level patterns)
      # MVC pattern scoring (directory and class-based detection)
      mvc_model_dir: 0.25
      mvc_view_dir: 0.25
      mvc_controller_dir: 0.25
      mvc_model_classes: 0.15
      mvc_view_classes: 0.10
      mvc_controller_classes: 0.15
      # Repository pattern scoring
      repository_classes: 0.8
      repository_naming: 0.15
      # Service layer pattern scoring
      service_layer_classes: 0.7
      service_layer_multiple: 0.2
      # Layered architecture scoring
      layered_base: 0.5
      layered_per_layer: 0.1
      layered_services_repos: 0.15

    # Code smell thresholds
    thresholds:
      god_class_methods: 20  # Max methods before God Class
      god_class_lines: 500  # Max lines before God Class
      long_method_lines: 50  # Max lines before Long Method
      long_method_complexity: 10  # Max complexity before Long Method
      long_parameter_list: 5  # Max parameters before Long Parameter List
      lazy_class_max_methods: 2  # Max methods for Lazy Class

  # Life-of-X Analysis Settings
  lifeofx:
    enabled: true  # Enable execution path and data flow analysis
    max_trace_depth: 20  # Maximum depth for execution traces
    max_paths: 10  # Maximum execution paths to return
    detect_long_chains: true  # Detect long call chains
    min_chain_length: 10  # Minimum chain length to report

    # Entry Point Scoring Configuration
    # Used by _resolve_entry_point() to rank candidate functions
    scoring:
      entry_point_bonus: 100  # Bonus for files containing entry points (views, api, routes, handlers)
      utility_penalty: -50  # Penalty for utility files (managers, tasks, helpers, factories)
      keyword_match_bonus: 10  # Bonus when any keyword matches function name
      all_keywords_bonus: 20  # Bonus when all keywords match function name
      entry_point_name_bonus: 15  # Bonus for common entry point function names (submit, create, handle, etc)

# Network and Tool Settings
tools:
  web:
    timeout: 10  # HTTP request timeout in seconds
    max_retries: 3  # Max retry attempts for failed requests
  repo:
    grep_timeout: 30  # Grep search timeout in seconds
    max_grep_results: 100  # Maximum grep results to return
