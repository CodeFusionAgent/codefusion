# CodeFusion Configuration

# LLM Settings
llm:
  model: "gpt-4o"
  api_key: ""
  max_tokens: 2000
  #temperature: 0.7

  # Multi-Model Tiered Strategy (NEW)
  # Match task complexity to model capability for optimal cost/performance
  tiers:
    fast:
      model: "claude-3-5-haiku-20241022"  # Fast, cheap for simple tasks
      use_cases: ["file_summaries", "classification", "coordination"]
      cost_per_1m: 0.25  # ~$0.25/1M tokens
    standard:
      model: "gpt-4o"  # Balanced for most tasks
      use_cases: ["general_analysis", "moderate_reasoning"]
      cost_per_1m: 2.50  # ~$2.50/1M tokens
    advanced:
      model: "claude-sonnet-4-5"  # Best for complex synthesis
      use_cases: ["final_synthesis", "deep_reasoning"]
      cost_per_1m: 3.00  # ~$3.00/1M tokens

# Agent Settings
agents:
  max_iterations: 10
  timeout: 300  # seconds
  use_pipeline_architecture: true  # Use new modular pipeline architecture (recommended)
  max_files_to_analyze: 50  # Maximum files for discovery pipeline

  # Parallel Processing Settings (NEW)
  # Dramatically improves performance for file analysis
  parallel_analysis: true  # Enable parallel file analysis (recommended)
  parallel_workers: 10  # Number of concurrent LLM calls (adjust based on API limits)

  # Synthesis configuration
  synthesis:
    target_narrative_min: 3000  # Minimum narrative word count
    target_narrative_max: 5000  # Maximum narrative word count
    max_key_files_cited: 7      # Maximum files to cite
    min_key_files_cited: 3      # Minimum files to cite

  # Thresholds for confidence scoring
  thresholds:
    high_confidence: 0.8
    medium_confidence: 0.7
    low_confidence: 0.6
    error_confidence: 0.2
    partial_confidence: 0.5
    max_confidence: 0.9

# Cache Settings
cache:
  enabled: false                 # Set to false to disable caching for debugging
  cache_dir: "cf_cache"          # Directory to store cache files
  ttl: 3600                      # Time to live in seconds (1 hour)
  similarity_threshold: 0.8      # Semantic similarity threshold (0.0-1.0)

# Tracing Settings
trace:
  enabled: true
  output_dir: "cf_trace"

# Logging Settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  verbose: false  # Enable detailed agent activity logging
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Repository Settings
repo:
  max_files: 1000
  max_file_size: 1048576  # 1MB
  max_scan_depth: 5  # Maximum directory depth for repository scanning
  max_analysis_files: 50  # Maximum files to analyze for performance control
  # Source code extensions (analyzed by CodeAgent)
  source_code_extensions:
