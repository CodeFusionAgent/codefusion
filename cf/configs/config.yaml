# CodeFusion Configuration

# LLM Settings
llm:
  model: "gpt-4o"  # Default model (not used in tiered approach)
  api_key: ""  # Optional: Anthropic key here or use ANTHROPIC_API_KEY env var
  max_tokens: 2000
  #temperature: 0.7

  # Azure OpenAI Configuration
  # When enabled: All GPT models (standard tier) will use Azure
  # When disabled: GPT models will use standard OpenAI API
  azure:
    enabled: true  # ← Set to true to use Azure OpenAI for GPT models
    endpoint: ""  # ← REQUIRED: https://your-resource.openai.azure.com
    api_version: "2024-02-15-preview"
    deployment_id: ""  # ← REQUIRED: Your Azure deployment name (e.g., "gpt-4o")
    api_key: ""  # ← REQUIRED: Your Azure API key (or set AZURE_OPENAI_API_KEY env var)

  # Multi-Model Tiered Strategy
  # FAST tier: Use Claude Haiku (Anthropic) - cheapest, fastest for simple tasks
  # STANDARD tier: Use GPT-4o (Azure OpenAI) - balanced for most tasks
  # ADVANCED tier: Use Claude Sonnet (Anthropic) - best quality for complex reasoning
  tiers:
    fast:
      model: "claude-3-5-haiku-20241022"  # Anthropic - $0.25/1M tokens
      use_cases: ["file_summaries", "classification", "coordination"]
      cost_per_1m: 0.25
    standard:
      model: "gpt-4o"  # Azure OpenAI (when azure.enabled=true)
      use_cases: ["general_analysis", "moderate_reasoning"]
      cost_per_1m: 2.50
    advanced:
      model: "claude-sonnet-4-5"  # Anthropic - $3.00/1M tokens
      use_cases: ["final_synthesis", "deep_reasoning"]
      cost_per_1m: 3.00

  # API Retry Configuration (NEW)
  # Handles rate limiting and transient errors with exponential backoff
  max_retries: 3  # Number of retry attempts for API calls (429, 5xx errors)
  retry_delay_seconds: 2  # Initial delay between retries
  use_exponential_backoff: true  # Use exponential backoff (2s, 4s, 8s, ...)

# Agent Settings
agents:
  max_iterations: 20  # Increased from 10 to support 3 passes with 3 agents (worst case: 13 iterations + margin)
  timeout: 300  # seconds
  max_files_to_analyze: 50  # Maximum files for discovery pipeline

  # Parallel Processing Settings (NEW)
  # Dramatically improves performance for file analysis
  parallel_analysis: true  # Enable parallel file analysis (recommended)
  parallel_workers: 10  # Number of concurrent LLM calls (adjust based on API limits)
  parallel_min_files: 3  # Minimum files to enable parallel processing
  max_llm_json_size: 10000  # Maximum JSON response size from LLM (chars)
  enable_adaptive_workers: true  # Automatically reduce workers on rate limiting (NEW)

  # Synthesis configuration
  synthesis:
    target_narrative_min: 3000  # Minimum narrative word count
    target_narrative_max: 5000  # Maximum narrative word count
    max_key_files_cited: 7      # Maximum files to cite
    min_key_files_cited: 3      # Minimum files to cite

  # Thresholds for confidence scoring and decision making
  thresholds:
    high_confidence: 0.8
    medium_confidence: 0.7
    low_confidence: 0.6
    error_confidence: 0.2
    partial_confidence: 0.5
    max_confidence: 0.9
    min_confidence: 0.3  # Minimum confidence for accepting results
    min_insights_for_pass: 2  # Minimum insights required before moving to next pass
    loop_detection_min_actions: 3  # Minimum actions before checking for loops

    # Validation thresholds
    min_analysis_certainty: 0.7  # Minimum grounding score for validation
    min_line_coverage: 0.5  # Minimum line number coverage
    min_path_accuracy: 0.9  # Minimum file path accuracy
    validation_no_refs_score: 0.3  # Score when no references found
    validation_refs_base: 0.5  # Base score for grounding calculation
    validation_refs_increment: 0.05  # Increment per reference

  # Synthesis quality thresholds
  synthesis_thresholds:
    word_count_tolerance: 0.8  # Accept if >= 80% of target
    line_refs_high: 5  # High quality line reference count
    line_refs_medium: 3  # Medium quality line reference count
    path_refs_high: 5  # High quality path reference count
    path_refs_medium: 3  # Medium quality path reference count
    code_blocks_min: 4  # Minimum code blocks for bonus
    sections_min: 3  # Minimum sections for structure bonus

  # Validation configuration (Anti-hallucination)
  validation:
    enable_fact_verification: true  # Verify claims against actual code
    max_claims_to_verify: 20  # Limit for performance (verify top 20 claims)
    min_identifier_match: 0.3  # Minimum % of identifiers that must match
    use_llm_verification: false  # Use LLM for complex verification (costs more)

# Cache Settings
cache:
  enabled: false                 # Set to false to disable caching for debugging
  cache_dir: "cf_cache"          # Directory to store cache files
  ttl: 3600                      # Time to live in seconds (1 hour)
  similarity_threshold: 0.8      # Semantic similarity threshold (0.0-1.0)

# Tracing Settings
trace:
  enabled: true
  output_dir: "cf_trace"

# Logging Settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  verbose: false  # Enable detailed agent activity logging
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Repository Settings
