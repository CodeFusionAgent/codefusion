# CodeFusion Configuration
# Simplified config with only essential user-configurable parameters
# All tuning parameters are now hardcoded constants in the code

# =================================================================
# LLM Configuration
# =================================================================
llm:
  timeout: 180

  # Retry settings
  max_retries: 3
  retry_delay_seconds: 2
  use_exponential_backoff: true

  # Tiered model strategy (fast/standard/advanced)
  tiers:
    fast:
      model: claude-opus-4-5
      #model: Qwen/Qwen3-8B
      use_cases: [file_summaries, classification, coordination]
    standard:
      model: claude-opus-4-5
      #model: Qwen/Qwen3-8B
      use_cases: [general_analysis, moderate_reasoning]
    advanced:
      model: claude-opus-4-5
      #model: Qwen/Qwen3-8B
      use_cases: [final_synthesis, deep_reasoning]

  # Model configurations - add API keys via environment variables
  models:
    gpt-4.1-mini:
      provider: azure
      endpoint: https://arune-mfpva4eo-eastus2.openai.azure.com/
      subscription_key: ''  # Use AZURE_OPENAI_API_KEY env var
      model_name: gpt-4.1-mini
      deployment: gpt-4.1-mini
      api_version: 2024-08-01-preview

    gpt-4o:
      provider: azure
      endpoint: ''
      deployment: gpt-4o
      subscription_key: ''
      api_version: 2024-02-15-preview
    claude-sonnet-4-5:
      provider: anthropic
      api_key: ''  # Use ANTHROPIC_API_KEY env var
      base_url: https://api.anthropic.com/
    claude-opus-4-5:
      provider: anthropic
      api_key: ''  # Use ANTHROPIC_API_KEY env var
      base_url: https://api.anthropic.com/
    claude-haiku-4-5:
      provider: anthropic
      api_key: ''  # Use ANTHROPIC_API_KEY env var
      base_url: https://api.anthropic.com/
    Qwen/Qwen3-8B:
      provider: huggingface
      api_key: ''  # Use HF_TOKEN env var
      base_url: https://router.huggingface.co/v1

# =================================================================
# Analysis Configuration
# =================================================================
agents:
  # Core limits
  max_files_to_analyze: 100  # Increased for better coverage
  max_iterations: 40         # Increased from 30 for more thorough exploration
  timeout: 600  # 10 minutes

  # File enrichment limit (how many files get AST analysis)
  max_files_to_enrich: 30    # Increased from 25

  # Import following limit (how many imported files to analyze in second pass)
  max_import_follow: 20      # Increased from 15

  # Minimum files required before answering (prevents early termination)
  min_files_required: 8      # Increased from 5

  # Recursive import tracing configuration
  import_tracing:
    enabled: true
    max_depth: 5             # Follow imports up to 5 levels deep (increased for deep architectures)
    max_files_per_level: 8   # Read up to 8 files at each depth level

  # Multi-pass analysis
  max_passes: 3

  # Parallel processing (adjust based on API rate limits)
  parallel_analysis: true
  parallel_workers: 10

  # Agent enablement (code-only focus)
  docs_enabled: false
  web_enabled: false

  # LLM-driven adaptive exploration
  # Enables ReAct-style tool selection for deeper code exploration
  exploration:
    enabled: true          # Enable adaptive exploration after file analysis
    max_iterations: 10     # Max LLM decision loops per question
    max_tool_calls: 15     # Max tool invocations per exploration
    tool_timeout_seconds: 30  # Timeout for individual tool calls

# =================================================================
# Knowledge Base Configuration
# =================================================================
knowledge_base:
  # Enable/disable KB
  enabled: true

  # KB type: 'sqlite' (default, no setup) or 'neo4j' (requires Neo4j install)
  type: sqlite

  # Neo4j configuration (if type=neo4j)
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: ''  # Use NEO4J_PASSWORD env var
    database: codefusion

  # SQLite configuration (if type=sqlite)
  sqlite:
    db_path: .codefusion/knowledge.db

  # Build settings
  build:
    auto_build: true
    parallel_workers: 10
    languages: [python]

  # Semantic search
  semantic:
    enabled: true
    embedding_model: all-MiniLM-L6-v2  # Local model, no API needed
    cache_file: .codefusion/embeddings.pkl

  # Pattern detection
  patterns:
    enabled: true
    detect_design_patterns: true
    detect_code_smells: true

# =================================================================
# System Configuration
# =================================================================
cache:
  enabled: false  # Disable for deterministic eval results
  cache_dir: cf_cache

logging:
  level: INFO
  verbose: false

trace:
  enabled: true
  output_dir: cf_trace

# =================================================================
# Discovery & Validation
# =================================================================
discovery:
  prioritize_test_files: true  # Analyze tests first to understand behavior
  use_kb_queries: true
  fallback_to_keywords: true

validation:
  enable_fact_verification: true
  provide_fix_suggestions: true

# =================================================================
# NOTE: All other parameters (synthesis limits, discovery tuning,
# validation thresholds, etc.) are now hardcoded as constants in:
# - cf/agents/pipelines/synthesis.py
# - cf/agents/pipelines/discovery.py
# - cf/agents/pipelines/validation.py
# - cf/agents/kb/structural_kb_agent.py
#
# This keeps config simple while allowing advanced users to modify
# code constants if needed.
# =================================================================
