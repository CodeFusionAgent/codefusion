            if not meta.auto_created:
                pre_save.send(
                    sender=origin,
                    instance=self,
                    raw=raw,
                    using=using,
                    update_fields=update_fields,
                )

            # Perform actual save...
            updated = self._save_table(...)

            # After save notification
            if not meta.auto_created:
                post_save.send(
                    sender=origin,
                    instance=self,
                    created=(not updated),
                    update_fields=update_fields,
                    raw=raw,
                    using=using,
                )

